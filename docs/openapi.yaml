openapi: 3.0.0
info:
  title: Fitness Booking API
  version: 1.0.0
  description: |
    REST API for the Fitness Class Booking platform.

    ## Authentication
    Most endpoints require a Bearer JWT token in the `Authorization` header.
    Obtain a token via `POST /auth/login`.

    ## Roles
    - **student**: Can view classes, create/cancel own bookings
    - **instructor**: Can also create/edit classes
    - **admin**: Full access including user management and payment updates

servers:
  - url: /api/v1
    description: API v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:       { type: string }
        name:     { type: string }
        email:    { type: string, format: email }
        role:     { type: string, enum: [admin, instructor, student] }
        language: { type: string, enum: [en, fr] }
        createdAt:{ type: string, format: date-time }

    Class:
      type: object
      properties:
        id:            { type: string }
        title:         { type: string }
        description:   { type: string }
        instructorId:  { type: string }
        instructor:    { $ref: '#/components/schemas/User' }
        startTime:     { type: string, format: date-time }
        endTime:       { type: string, format: date-time }
        capacity:      { type: integer }
        price:         { type: number }
        location:      { type: string }
        isRecurring:   { type: boolean }
        recurrenceRule:{ type: string }
        status:        { type: string, enum: [upcoming, full, cancelled] }
        createdAt:     { type: string, format: date-time }

    Booking:
      type: object
      properties:
        id:            { type: string }
        userId:        { type: string }
        classId:       { type: string }
        status:        { type: string, enum: [confirmed, waitlisted, cancelled] }
        paymentStatus: { type: string, enum: [pending, paid, refunded] }
        paymentAmount: { type: number }
        paymentRef:    { type: string }
        bookedAt:      { type: string, format: date-time }
        cancelledAt:   { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }

paths:
  /health:
    get:
      summary: Health check
      description: Returns server status. Used by Elastic Beanstalk health monitoring.
      tags: [System]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string, example: Alice Smith }
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                language: { type: string, enum: [en, fr], default: en }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      summary: Login and get JWT token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:  { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /classes:
    get:
      summary: List all fitness classes
      tags: [Classes]
      responses:
        '200':
          description: List of classes
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items: { $ref: '#/components/schemas/Class' }

    post:
      summary: Create a new fitness class
      tags: [Classes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, instructorId, startTime, endTime, capacity, price, location]
              properties:
                title:         { type: string }
                description:   { type: string }
                instructorId:  { type: string }
                startTime:     { type: string, format: date-time }
                endTime:       { type: string, format: date-time }
                capacity:      { type: integer, minimum: 1 }
                price:         { type: number, minimum: 0 }
                location:      { type: string }
                isRecurring:   { type: boolean }
                recurrenceRule:{ type: string }
      responses:
        '201':
          description: Class created
          content:
            application/json:
              schema:
                type: object
                properties:
                  class: { $ref: '#/components/schemas/Class' }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (student role)

  /classes/{id}:
    get:
      summary: Get a specific class with bookings
      tags: [Classes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Class details
          content:
            application/json:
              schema:
                type: object
                properties:
                  class: { $ref: '#/components/schemas/Class' }
        '404':
          description: Class not found

    put:
      summary: Update a class
      tags: [Classes]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Class' }
      responses:
        '200':
          description: Class updated
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      summary: Delete a class
      tags: [Classes]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Class deleted
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found

  /bookings:
    post:
      summary: Book a class (or join waitlist if full)
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classId]
              properties:
                classId: { type: string }
      responses:
        '201':
          description: Booking created (confirmed or waitlisted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/Booking' }
        '409':
          description: Already booked for this class

  /bookings/my:
    get:
      summary: Get current user's bookings
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User's booking list
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }

  /bookings/{id}:
    delete:
      summary: Cancel a booking
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Booking cancelled; waitlist promotion triggered if applicable
        '403':
          description: Outside cancellation window or not your booking
        '404':
          description: Booking not found

  /admin/stats:
    get:
      summary: Admin dashboard statistics
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Aggregated stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBookings: { type: integer }
                  totalRevenue:  { type: number }
                  classCount:    { type: integer }

  /admin/users:
    get:
      summary: List all users (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }

  /admin/classes/{classId}/bookings:
    get:
      summary: Get all bookings for a class (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bookings for the class
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }

  /admin/bookings:
    post:
      summary: Book a class on behalf of a user (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, classId]
              properties:
                userId: { type: string }
                classId: { type: string }
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/Booking' }
        '403':
          description: Admin cannot book for themselves

  /admin/users/{userId}/bookings:
    get:
      summary: Get all bookings for a specific user (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }

  /admin/bookings/{id}/payment:
    patch:
      summary: Update payment status (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentStatus: { type: string, enum: [pending, paid, refunded] }
                paymentRef:    { type: string }
      responses:
        '200':
          description: Payment updated

  /admin/bookings/{id}/promote:
    patch:
      summary: Manually promote a waitlisted booking (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Booking promoted to confirmed

  /admin/settings:
    get:
      summary: Get all app settings (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      cancellationWindowHours:
                        type: string
                        example: "24"
                        description: Hours before class start that cancellation is allowed

    put:
      summary: Update an app setting (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: cancellationWindowHours
                value:
                  type: string
                  example: "48"
      responses:
        '200':
          description: Setting updated, returns all current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties: { type: string }
        '400':
          description: Invalid input
        '403':
          description: Forbidden (admin only)
